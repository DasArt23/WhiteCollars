[project]
name = "photonic-model"
version = "0.1.0"
description = "Neural synthesis and evaluation of Diffractive Optical Elements (DOE)"
readme = "README.md"
authors = [
    { name = "bakin.aa2", email = "bakin.aa2@dozen.mephi.ru" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0",
    "pillow>=13.0.0",
    "scikit-image>=0.24.0",
    "torch==2.14.1",
]

[project.scripts]
project = "main:main"
doe-eval = "doe_eval.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*", "dataset*", "model*", "doe_eval*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
addopts = "-v"

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]
