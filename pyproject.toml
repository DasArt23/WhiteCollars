[project]
name = "photonic-model"
version = "0.1.0"
description = "Neural synthesis and evaluation of Diffractive Optical Elements (DOE)"
readme = "README.md"
authors = [
    { name = "bakin.aa2", email = "bakin.aa2@dozen.mephi.ru" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0",
    "pillow>=13.0.0",
    "scikit-image>=0.24.0",
    "torch>=2.4.0",
]

[project.optional-dependencies]
# CUDA 13 wheels do not support Tesla V100 (Volta, sm_70).
v100 = ["torch==2.10.0; sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", extra = "v100", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[project.scripts]
project = "main:main"
doe-eval = "doe_eval.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*", "dataset*", "model*", "doe_eval*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
app = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
addopts = "-v"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]
